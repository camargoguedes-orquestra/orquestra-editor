<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OrquestraFileViewer — exemplo local</title>
<link rel="stylesheet" href="../packages/file-viewer/src/styles.css">
<style>body{font:16px system-ui;margin:2rem auto;max-width:850px;padding:0 1rem}button{padding:.6rem}#viewer{margin-top:1rem}</style>
</head><body>
<h1>FileViewer independente — demonstração local</h1>
<p>Este exemplo usa um arquivo de texto estático para testar o visualizador; em produção, o arquivo deve ser servido por uma rota autorizada.</p>
<button id="abrir">Abrir arquivo de exemplo</button><div id="viewer"></div>
<script type="module">
import {OrquestraFileViewer} from '../packages/file-viewer/src/index.mjs';
const blob = new Blob(['Orquestra Components\n\nExemplo sem backend\nNenhuma credencial necessária neste modo demonstrativo.'],{type:'text/plain'});
const textUrl = URL.createObjectURL(blob);
const viewer=new OrquestraFileViewer({
 element:'#viewer',
 // A implementação real deve retornar sempre uma URL de backend autorizada.
 resolve:async()=>({url:'/examples/file-viewer-demo.txt',downloadAllowed:false})
});
document.querySelector('#abrir').addEventListener('click',()=>viewer.open({id:'demo',name:'exemplo.txt',mime:'text/plain'}));
</script></body></html>
